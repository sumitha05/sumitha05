<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <rect width="1200" height="240" fill="#020617"/>

  <text x="40" y="60" fill="#fdba74"
        font-family="Courier New, monospace" font-size="16">
    &gt; initializing ui-engineer.os v0.1.0
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze"/>
  </text>

  <text x="40" y="95" fill="#fed7aa"
        font-family="Courier New, monospace" font-size="16">
    &gt; loading design-to-code pipeline
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
  </text>

  <text x="40" y="130" fill="#fecaca"
        font-family="Courier New, monospace" font-size="16">
    &gt; enabling accessibility &amp; motion preferences
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
  </text>

  <text x="40" y="165" fill="#fde68a"
        font-family="Courier New, monospace" font-size="16">
    &gt; interface ready
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.4s" fill="freeze"/>
  </text>

  <text x="40" y="205" fill="#ffffff"
        font-family="Courier New, monospace" font-size="32"
        letter-spacing="2">
    SUMITHA SREEKUMAR
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.5s" fill="freeze"/>
  </text>

  <text x="40" y="230" fill="#fdba74"
        font-family="Courier New, monospace" font-size="14"
        letter-spacing="2">
    UI ENGINEER · ACCESSIBLE · INTERACTION-DRIVEN
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/>
  </text>

  <!-- Cursor (escaped, safe) -->
  <text x="430" y="230" fill="#fdba74"
        font-family="Courier New, monospace" font-size="14">
    &#9608;
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1s"
             repeatCount="6"/>
  </text>
</svg>
